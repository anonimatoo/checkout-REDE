services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: csrede
      POSTGRES_USER: csrede
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - checkout-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U csrede -d csrede]
      interval: 4s
      timeout: 3s
      retries: 15
    networks: [database]
    restart: unless-stopped

  app:
    build:
      context: .
      target: checkout
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Configure uma origem HTTPS}
      APP_HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_IP: 172.28.44.10
      DATABASE_URL: postgres://csrede:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/csrede
      LINK_ENCRYPTION_KEY: ${LINK_ENCRYPTION_KEY:?Configure LINK_ENCRYPTION_KEY}
      EGRESS_PROBE_URL: ${EGRESS_PROBE_URL:-}
      CONNECT_URL: ${CONNECT_URL:-}
      CONNECT_TOKEN: ${CONNECT_TOKEN:-}
      CONNECT_PRIVATE_HTTP: ${CONNECT_PRIVATE_HTTP:-false}
    depends_on:
      db:
        condition: service_healthy
    networks: [web, database, integration]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  connect:
    profiles: [connect]
    build:
      context: .
      target: connect
    environment:
      CONNECT_HOST: 0.0.0.0
      CONNECT_PORT: 3400
      CONNECT_PRIVATE_HTTP: "true"
      CONNECT_TOKEN: ${CONNECT_TOKEN:-}
      CONNECT_REDE_KEY: ${CONNECT_REDE_KEY:-}
      CONNECT_DATABASE_URL: postgres://csrede:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@db:5432/csrede
      EGRESS_PROBE_URL: ${EGRESS_PROBE_URL:-}
    networks: [integration, database]
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports:
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/tls:/etc/nginx/tls:ro
    depends_on: [app]
    networks:
      web:
        ipv4_address: 172.28.44.10
    restart: unless-stopped

networks:
  web:
    ipam:
      config:
        - subnet: 172.28.44.0/24
  database:
    internal: true
  integration:

volumes:
  checkout-data:
